# Type checks for the bench and setup scripts (repo root) and the MCP server (plugin/server).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci
        working-directory: plugin/server
      - run: npm run typecheck
        working-directory: plugin/server
