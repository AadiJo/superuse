[package]
name = "superuse-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical typed SDK and UniFFI boundary for Cua Driver"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait = "0.1"
superuse-contract = { path = "../superuse-contract" }
superuse-core = { path = "../superuse-core", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true, features = ["tokio"] }
uuid = { workspace = true }
cursor-overlay = { path = "../cursor-overlay" }
cursor-motion = { path = "../cursor-motion" }

[target.'cfg(target_os = "windows")'.dependencies]
platform-windows = { path = "../platform-windows" }

[features]
default = []

[dev-dependencies]
tempfile = "3"
uniffi = { workspace = true, features = ["bindgen"] }
